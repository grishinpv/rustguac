<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>rustguac</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var c = localStorage.getItem('rustguac_theme_colors')
        if (c) {
          try {
            var o = JSON.parse(c),
              r = document.documentElement.style
            for (var k in o) r.setProperty('--' + k.replace(/_/g, '-'), o[k])
            if (o.bg_pattern && o.bg_pattern !== 'none') {
              var s = document.createElement('style')
              s.id = 'bg-pattern-style'
              s.textContent = 'body{background-image:' + o.bg_pattern + ';background-attachment:fixed}'
              document.head.appendChild(s)
            }
          } catch (e) {}
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
